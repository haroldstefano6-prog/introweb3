<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Registro Dinámico ITSI</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #0ea5e9;
            --accent: #10b981;
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.9);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Banner Mejorado con Glassmorphism y Estilo Corporativo */
        .header {
            text-align: center;
            margin-bottom: 35px;
            padding: 30px 20px;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #0ea5e9 100%);
            border-radius: 18px;
            color: white;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.3);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .header:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(37, 99, 235, 0.4);
        }

        .header::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
            transform: rotate(30deg);
            pointer-events: none;
            animation: shimmer 7s infinite linear;
        }

        @keyframes shimmer {
            0% { transform: translateY(-50%) rotate(0deg); }
            100% { transform: translateY(-50%) rotate(360deg); }
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.15);
        }

        .header p {
            color: #e0f2fe;
            font-size: 14px;
            font-weight: 400;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
        }

        .input-box label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        input {
            padding: 13px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            background-color: #f8fafc;
            color: var(--text-main);
        }

        input:focus {
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .btn-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 35px;
        }

        button {
            padding: 13px 28px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }

        button:active {
            transform: translateY(0);
        }

        .table-container {
            overflow-x: auto;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            background-color: #ffffff;
        }

        th, td {
            padding: 16px 20px;
            font-size: 14px;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-main);
            font-weight: 700;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
            transition: background 0.2s;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .stats-row {
            font-weight: 600;
            background-color: #f8fafc !important;
            border-top: 2px solid var(--border-color);
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            background-color: #dbeafe;
            color: var(--primary);
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
        }

        .btn-action {
            padding: 7px 14px;
            font-size: 12px;
            border-radius: 8px;
            margin-right: 6px;
            box-shadow: none;
        }

        .btn-edit {
            background-color: #f59e0b;
        }
        .btn-edit:hover { background-color: #d97706; box-shadow: 0 3px 8px rgba(245, 158, 11, 0.3); }

        .btn-delete {
            background-color: #ef4444;
        }
        .btn-delete:hover { background-color: #dc2626; box-shadow: 0 3px 8px rgba(239, 68, 68, 0.3); }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px !important;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Banner Mejorado e Interactivo -->
        <div class="header">
            <h1>REGISTRO ITSI: Control de Usuarios</h1>
            <p>Sistema inteligente para la gestión, control y analítica de los estudiantes que conforman el Instituto Superior Tecnológico de Ibarra.</p>
        </div>

        <!-- Formulario -->
        <div class="form-grid">
            <div class="input-box">
                <label>Nombre</label>
                <input type="text" id="nombre" placeholder="Ej. Carlos">
            </div>
            <div class="input-box">
                <label>Apellido</label>
                <input type="text" id="apellido" placeholder="Ej. Mendoza">
            </div>
            <div class="input-box">
                <label>Email</label>
                <input type="email" id="email" placeholder="carlos@correo.com">
            </div>
            <div class="input-box">
                <label>Edad</label>
                <input type="number" id="edad" placeholder="Ej. 25" min="1" max="120">
            </div>
        </div>

        <div class="btn-container">
            <button id="btnPrincipal" onclick="gestionarDato()">Guardar Registro</button>
        </div>

        <!-- Tabla -->
        <div class="table-container">
            <table id="tablaUsuarios">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Email</th>
                        <th>Edad</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="5" class="empty-state">No hay registros agregados aún.</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr class="stats-row">
                        <td colspan="3">Total de personas: <span id="totalPersonas" class="badge">0</span></td>
                        <td colspan="2">Edad promedio: <span id="promedioEdad" class="badge">0 años</span></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <script>
        let listaUsuarios = [];
        let indexModificando = null;

        function gestionarDato() {
            const nombre = document.getElementById('nombre').value.trim();
            const apellido = document.getElementById('apellido').value.trim();
            const email = document.getElementById('email').value.trim();
            const edad = parseInt(document.getElementById('edad').value);

            // 1. Validar campos vacíos
            if (!nombre || !apellido || !email || isNaN(edad)) {
                alert('⚠️ Por favor, completa todos los campos.');
                return;
            }

            // 2. Validar que Nombre y Apellido contengan solo letras y espacios
            const soloLetras = /^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$/;
            if (!soloLetras.test(nombre)) {
                alert('⚠️ El nombre solo debe contener letras.');
                return;
            }
            if (!soloLetras.test(apellido)) {
                alert('⚠️ El apellido solo debe contener letras.');
                return;
            }

            // 3. Validar estructura de Email real
            const formatoEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!formatoEmail.test(email)) {
                alert('⚠️ Por favor, ingresa un correo electrónico válido (ejemplo: usuario@correo.com).');
                return;
            }

            // 4. Validar que la edad sea coherente
            if (edad <= 0 || edad > 120) {
                alert('⚠️ La edad debe ser un número coherente entre 1 y 120.');
                return;
            }

            if (indexModificando === null) {
                listaUsuarios.push({ nombre, apellido, email, edad });
            } else {
                listaUsuarios[indexModificando] = { nombre, apellido, email, edad };
                indexModificando = null;
                document.getElementById('btnPrincipal').textContent = 'Guardar Registro';
            }

            limpiarFormulario();
            actualizarTabla();
        }

        function actualizarTabla() {
            const tbody = document.querySelector('#tablaUsuarios tbody');
            tbody.innerHTML = '';

            if (listaUsuarios.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No hay registros agregados aún.</td></tr>`;
                document.getElementById('totalPersonas').textContent = '0';
                document.getElementById('promedioEdad').textContent = '0 años';
                return;
            }

            let sumaEdades = 0;

            listaUsuarios.forEach((user, index) => {
                sumaEdades += user.edad;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${user.nombre}</td>
                    <td>${user.apellido}</td>
                    <td>${user.email}</td>
                    <td>${user.edad}</td>
                    <td>
                        <button class="btn-action btn-edit" onclick="cargarEdicion(${index})">Editar</button>
                        <button class="btn-action btn-delete" onclick="eliminarUsuario(${index})">Eliminar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('totalPersonas').textContent = listaUsuarios.length;
            const promedio = (sumaEdades / listaUsuarios.length).toFixed(1);
            document.getElementById('promedioEdad').textContent = promedio + ' años';
        }

        function cargarEdicion(index) {
            const user = listaUsuarios[index];
            document.getElementById('nombre').value = user.nombre;
            document.getElementById('apellido').value = user.apellido;
            document.getElementById('email').value = user.email;
            document.getElementById('edad').value = user.edad;

            indexModificando = index;
            document.getElementById('btnPrincipal').textContent = 'Actualizar Registro';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function eliminarUsuario(index) {
            listaUsuarios.splice(index, 1);
            if (indexModificando === index) {
                indexModificando = null;
                document.getElementById('btnPrincipal').textContent = 'Guardar Registro';
                limpiarFormulario();
            }
            actualizarTabla();
        }

        function limpiarFormulario() {
            document.getElementById('nombre').value = '';
            document.getElementById('apellido').value = '';
            document.getElementById('email').value = '';
            document.getElementById('edad').value = '';
        }
    </script>
</body>
</html>
