<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Personas</title>
</head>

<body>

    <h2>Registro de Personas</h2>

    <form id="formulario">

        <table>
            <tr>
                <td>Nombres:</td>
                <td>
                    <input id="txtNombres" type="text" required>
                </td>
            </tr>

            <tr>
                <td>Apellidos:</td>
                <td>
                    <input id="txtApellidos" type="text" required>
                </td>
            </tr>

            <tr>
                <td>Correo:</td>
                <td>
                    <input id="txtCorreo" type="email" required>
                </td>
            </tr>

            <tr>
                <td>Edad:</td>
                <td>
                    <input id="txtEdad" type="number" required>
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <button type="submit">Registrar</button>
                </td>
            </tr>
        </table>

    </form>

    <br>

    <h3>Personas Registradas</h3>

    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>Nombres</th>
                <th>Apellidos</th>
                <th>Correo</th>
                <th>Edad</th>
            </tr>
        </thead>

        <tbody id="cuerpoTabla">

        </tbody>
    </table>

    <br><br>

    <h3>Tabla de Multiplicar</h3>

    <button id="btnTabla" type="button">
        Generar Tabla de Multiplicar
    </button>

    <br><br>

    <div id="resultadoTabla"></div>

    <script src="js/script.js"></script>

</body>

</html>
