<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <button onclick="saludo()">
        SALUDAR
    </button>

    <button id="btnSuma">
        SUMAR
    </button>

</body>
</html>

<script>
    function saludo(){
        alert("HOLA TODOS");
    }

    document.getElementById("btnSuma").addEventListener('click', function() {
        alert("Bienvenido desde javascript");
    }
    );
</script>
