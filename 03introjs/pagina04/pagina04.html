<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Registros - ITSI</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Archivo CSS Externo -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="wrapper">
        <!-- Banner Principal -->
        <header class="header">
            <h1>REGISTRO ITSI</h1>
            <p>Sistema moderno para la gestión, control y edición de registros académicos de estudiantes.</p>
        </header>

        <!-- Formulario -->
        <section class="form-section">
            <div class="form-grid">
                <div class="input-box">
                    <label for="nombres">Nombres</label>
                    <input type="text" id="nombres" placeholder="Ej. Carlos Andrés">
                </div>
                <div class="input-box">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" placeholder="Ej. Mendoza Vera">
                </div>
                <div class="input-box">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" placeholder="carlos@correo.com">
                </div>
                <div class="input-box">
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" placeholder="Ej. 21" min="1" max="120">
                </div>
            </div>

            <div class="btn-container">
                <button id="btnAgregar" class="btn-primary">Agregar Registro</button>
            </div>
        </section>

        <!-- Tabla de Datos -->
        <section class="table-section">
            <div class="table-container">
                <table id="tablaRegistros">
                    <thead>
                        <tr>
                            <th>Nombres</th>
                            <th>Apellidos</th>
                            <th>Correo</th>
                            <th>Edad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="5" class="empty-state">No hay registros agregados aún.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Archivo JavaScript Externo -->
    <script src="script.js"></script>
</body>
</html>
